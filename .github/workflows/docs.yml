name: Docs

# Builds the MkDocs site on every push to main and on PRs that touch the docs
# (the PR build is strict, so broken links/anchors fail review before merge).
# Pushes to main and manual runs deploy to GitHub Pages; PR builds never deploy.
#
# REQUIRES repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions"
# (API: `build_type: "workflow"`). If that is set to "Deploy from a branch" instead, Pages
# builds the repo root with Jekyll and silently discards this workflow's artifact — while
# every run here still reports success. That is exactly what happened up to 2026-09-03:
# the published site was a Jekyll-rendered README and none of docs/ was reachable, with a
# green Docs badge the whole time. A passing run is NOT evidence the site is live; check
# a real page (e.g. /troubleshooting/) after changing anything about Pages.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Read-only by default; only the deploy job (never run for PRs) gets Pages write + OIDC.
permissions:
  contents: read

# One run per ref: main deploys are never interrupted; redundant PR builds cancel.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Build site (strict)
        run: uv run --locked --extra docs mkdocs build --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    # Everything except a PR build, so `workflow_dispatch` can actually publish. It was
    # `== 'push'`, which left the manual trigger able to build but never deploy — useless
    # in the one situation you reach for it (re-publishing after a Pages config change).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish the Pages deployment
      id-token: write   # OIDC token deploy-pages uses to authenticate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
