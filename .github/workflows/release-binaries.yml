# .github/workflows/release-binaries.yml
name: Release Binaries

# Builds standalone `agentry` executables + native installers and attaches them to
# the GitHub Release for a v* tag. This is the sole release/distribution channel
# (no PyPI).
#
# Two PyInstaller builds per target (see packaging/agentry.spec):
#   - one-folder (dist/agentry/: the executable + _internal/): every installer and archive
#     ships this. It starts in ~0.2s.
#   - one-file (dist-onefile/agentry): the bare single-file download. It unpacks itself on
#     every run, so it starts slower (~5s on macOS); kept for anyone who wants one file.
#
# Artifacts per release:
#   agentry-<version>-linux-x86_64.tar.gz      one-folder build (agentry/ folder)
#   agentry-<version>-macos-x86_64.tar.gz      one-folder build (agentry/ folder)
#   agentry-<version>-macos-arm64.tar.gz       one-folder build (agentry/ folder)
#   agentry-<version>-windows-x86_64.zip       one-folder build (agentry\ folder)
#   agentry-<version>-linux-x86_64             single-file binary
#   agentry-<version>-macos-x86_64             single-file binary
#   agentry-<version>-macos-arm64              single-file binary
#   agentry-<version>-windows-x86_64.exe       single-file binary
#   agentry-<version>-macos-x86_64.pkg         macOS installer (per-user)
#   agentry-<version>-macos-arm64.pkg          macOS installer (per-user)
#   agentry-<version>-windows-x86_64-setup.exe Inno Setup installer
#   agentry_<version>_amd64.deb                Debian/Ubuntu package
#   agentry-<version>.x86_64.rpm               Fedora/RHEL package
#   SHA256SUMS.txt                             checksums for all of the above
#   <asset>.cosign.bundle                      keyless Sigstore signature per asset
#
# Releases 0.1.4 and 0.1.5 also shipped each raw binary under its pre-0.1.4
# `agy-<version>-<target>` name for install.sh / install.ps1 copies older than 0.1.4.
# That shim is gone: those script copies must be re-downloaded to install newer releases.
#
# Every asset is signed with cosign keyless (Sigstore) via GitHub OIDC — no
# secrets or certificates required. See packaging/README.md for how users verify.
#
# workflow_dispatch builds + uploads artifacts for inspection but does NOT
# create a Release or sign (dry run), even when dispatched on a tag ref.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,  target: linux-x86_64,   ext: "",     pyarch: "" }
          # Pinned (not macos-latest) so the image only changes when we choose to:
          # macos-14 was retired on 2026-11-02 and silently cancelled both macOS legs.
          # macOS x86_64 is cross-built on this arm64 runner via an x86_64 CPython
          # under Rosetta 2 (see the "Ensure Rosetta 2" and "Build binary" steps).
          - { runner: macos-15,       target: macos-x86_64,    ext: "",     pyarch: x86_64 }
          - { runner: macos-15,       target: macos-arm64,     ext: "",     pyarch: "" }
          - { runner: windows-latest, target: windows-x86_64,  ext: ".exe", pyarch: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Ensure Rosetta 2 (macOS x86_64 cross build)
        if: matrix.pyarch == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true
      # --frozen: build from exactly the committed uv.lock, never re-resolve. CI (--locked /
      # `uv lock --check`) guarantees that lock matches pyproject.toml before a tag exists.
      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          pyi() {
            if [ -n "${{ matrix.pyarch }}" ]; then
              # Cross-build for Intel on the arm64 runner: an x86_64 CPython runs
              # under Rosetta, so PyInstaller freezes an x86_64 binary with x86_64
              # dependency wheels.
              uv run --frozen --python "cpython-3.12-macos-${{ matrix.pyarch }}" \
                --extra build pyinstaller "$@"
            else
              uv run --frozen --extra build pyinstaller "$@"
            fi
          }
          # One-folder build -> dist/agentry/ (what the installers and archives ship).
          pyi packaging/agentry.spec
          # One-file build -> dist-onefile/agentry (the bare single-file download).
          AGENTRY_ONEFILE=1 pyi --distpath dist-onefile --workpath build-onefile \
            packaging/agentry.spec
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(./dist/agentry/agentry${{ matrix.ext }} version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          fi

      # --- Linux: native packages (.deb / .rpm) + tarball, from ./dist/agentry/ ---
      - name: Build Linux packages
        if: matrix.target == 'linux-x86_64'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.41.3/nfpm_2.41.3_amd64.deb" -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
          nfpm package -f packaging/nfpm.yaml -p deb -t .
          nfpm package -f packaging/nfpm.yaml -p rpm -t .
          tar -czf "agentry-${VERSION}-linux-x86_64.tar.gz" -C dist agentry
          # Install the .deb on the runner and run it through its /usr/bin links.
          sudo dpkg -i "agentry_${VERSION}_amd64.deb"
          agentry version
          agyx version
          sudo dpkg -r agentry

      # --- Windows: Inno Setup installer + zip, from dist\agentry\ ---
      - name: Build Windows installer
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            packaging\windows\agentry.iss
          # Keep every release asset flat at the repo root for a clean upload.
          Move-Item dist\agentry-*-setup.exe .
          Compress-Archive -Path dist\agentry `
            -DestinationPath "agentry-${{ steps.ver.outputs.version }}-windows-x86_64.zip"

      # install.ps1 end to end: serve this build's zip from a local HTTP server, point a
      # copy of the script at it, install, and run the result and an alias shim.
      - name: Test install.ps1
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $zip = "agentry-$v-windows-x86_64.zip"
          $rel = "relsrv\v$v"
          New-Item -ItemType Directory -Force $rel | Out-Null
          Copy-Item $zip $rel
          $h = (Get-FileHash "$rel\$zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content "$rel\SHA256SUMS.txt" "$h  $zip"
          $line = '$base  = "https://github.com/$Repo/releases/download/$tag"'
          $script = Get-Content install.ps1 -Raw
          if (-not $script.Contains($line)) { throw "install.ps1 no longer has the line this step redirects" }
          $script.Replace($line, '$base  = "http://127.0.0.1:8765/$tag"') | Set-Content test-install.ps1
          $srv = Start-Process python -ArgumentList '-m','http.server','8765','--directory','relsrv' -PassThru
          Start-Sleep -Seconds 3
          try {
            $env:AGENTRY_VERSION = $v
            $env:AGENTRY_INSTALL_DIR = "$PWD\test-install"
            ./test-install.ps1
            if (-not (Test-Path "test-install\_internal")) { throw "_internal was not installed" }
            & "test-install\agentry.exe" version
            if ($LASTEXITCODE) { throw "agentry.exe exited $LASTEXITCODE" }
            & "test-install\agyx.cmd" version
            if ($LASTEXITCODE) { throw "agyx.cmd exited $LASTEXITCODE" }
          } finally {
            Stop-Process $srv
            Remove-Item -Recurse -Force relsrv, test-install, test-install.ps1
          }

      # --- macOS: tarball + per-user .pkg installer (~/.local), from ./dist/agentry/ ---
      - name: Build macOS installer
        if: startsWith(matrix.target, 'macos-')
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tar -czf "agentry-${VERSION}-${TARGET}.tar.gz" -C dist agentry
          # Payload rooted at the user's home; enable_currentUserHome maps it to ~, so the
          # folder lands at ~/.local/lib/agentry/ and ~/.local/bin/agentry links to it
          # (matches install.sh). preinstall clears out an earlier install; postinstall
          # adds the agy/agyx symlinks.
          mkdir -p pkgroot/.local/lib pkgroot/.local/bin
          cp -R dist/agentry pkgroot/.local/lib/agentry
          ln -s ../lib/agentry/agentry pkgroot/.local/bin/agentry
          chmod +x packaging/macos/scripts/preinstall packaging/macos/scripts/postinstall
          pkgbuild --root pkgroot \
            --identifier com.opentech.agentry \
            --version "$VERSION" \
            --scripts packaging/macos/scripts \
            --install-location / \
            agentry-component.pkg
          sed "s/\${VERSION}/$VERSION/g" packaging/macos/distribution.xml > distribution.xml
          productbuild --distribution distribution.xml \
            --package-path . \
            "agentry-${VERSION}-${TARGET}.pkg"
          # Verify the payload: the folder build, and a link to it in ~/.local/bin.
          pkgutil --expand-full "agentry-${VERSION}-${TARGET}.pkg" /tmp/pkgcheck
          test -x /tmp/pkgcheck/*.pkg/Payload/.local/lib/agentry/agentry
          test -d /tmp/pkgcheck/*.pkg/Payload/.local/lib/agentry/_internal
          test -L /tmp/pkgcheck/*.pkg/Payload/.local/bin/agentry
          # Drop intermediates so only the final product pkg is uploaded
          # (agentry-component.pkg would otherwise match the agentry-* upload glob).
          rm -rf agentry-component.pkg distribution.xml pkgroot /tmp/pkgcheck

      - name: Rename raw binary
        shell: bash
        run: mv "dist-onefile/agentry${{ matrix.ext }}" "agentry-${{ steps.ver.outputs.version }}-${{ matrix.target }}${{ matrix.ext }}"
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          ./agentry-${{ steps.ver.outputs.version }}-${{ matrix.target }}${{ matrix.ext }} version
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/agentry/agentry.exe version
          else
            # Installers link to the folder build; it must find _internal/ through a link.
            ln -s "$PWD/dist/agentry/agentry" smoke-link
            ./smoke-link version
            rm smoke-link
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentry-${{ matrix.target }}
          # Raw binary, folder archive, plus any installer/packages produced above — all
          # live flat at the repo root, so a single set of globs keeps the layout.
          path: |
            agentry-*
            *.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Both checks, not just ref_type: a workflow_dispatch started on a tag also has
    # ref_type == 'tag', and a dispatch must never sign, publish a Release or push the tap.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release + upload assets
      id-token: write   # cosign keyless signing via OIDC
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum agentry-* agentry_* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Sign all assets (cosign keyless)
        working-directory: artifacts
        run: |
          shopt -s nullglob
          for f in agentry-* agentry_* SHA256SUMS.txt; do
            case "$f" in *.cosign.bundle) continue ;; esac
            echo "Signing $f"
            cosign sign-blob --yes --bundle "$f.cosign.bundle" "$f"
          done
      - name: Create / update Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/*
          generate_release_notes: true

  homebrew:
    name: Publish Homebrew formula
    needs: release
    # Same guard as `release` (dispatch on a tag must never publish the tap).
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # read SHA256SUMS.txt off this repo's release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Download SHA256SUMS.txt from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ steps.ver.outputs.version }}" \
            --repo "${{ github.repository }}" --pattern SHA256SUMS.txt
      - name: Render formula
        run: |
          python3 scripts/render_homebrew.py \
            "${{ steps.ver.outputs.version }}" SHA256SUMS.txt \
            packaging/homebrew/agentry.rb > agentry.rb
      - name: Push to tap
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap publish."
            echo "Create OpenTechIL/homebrew-tap and add the secret to enable this (see packaging/README.md)."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/OpenTechIL/homebrew-tap.git" tap
          mkdir -p tap/Formula tap/Aliases
          cp agentry.rb tap/Formula/agentry.rb
          # Keep `brew install OpenTechIL/tap/agy` working via Homebrew's alias mechanism
          # (a symlink under Aliases/), and drop the old formula file it replaces.
          rm -f tap/Formula/agy.rb
          ln -sf ../Formula/agentry.rb tap/Aliases/agy
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Formula Aliases
          # No-op-safe: re-running a tag with an identical formula shouldn't fail.
          git commit -m "agentry ${VERSION}" || { echo "Formula unchanged — nothing to push."; exit 0; }
          git push
