name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      # Pinned so a new ruff release can't fail an unrelated PR, and so the version here
      # matches .pre-commit-config.yaml (they must be bumped together).
      - name: Ruff lint
        run: uvx ruff@0.15.20 check --output-format=github .
      - name: Ruff format check
        run: uvx ruff@0.15.20 format --check .
      # uv.lock is what release binaries are frozen from, so it must match pyproject.toml.
      # Without this, `uv run` silently re-locks a stale lock and CI tests versions the
      # release never ships. Every `uv run` below also passes --locked for the same reason.
      # Fix a failure with `uv lock` and commit the result.
      - name: Check uv.lock is up to date
        run: uv lock --check
      - name: Type check
        run: uv run --locked --extra dev mypy

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # --cov-fail-under is the point: coverage was measured before but never gated, so a
      # PR could drop it 20 points and still go green. Set at the level measured when the
      # gate was introduced; raise it, never lower it.
      - name: Run tests
        run: >-
          uv run --locked --extra dev pytest
          --cov=agentry --cov-report=term-missing --cov-fail-under=85

  # Symlinks are the default install strategy, and Windows refuses them without Developer
  # Mode — yet the release workflow ships Windows and macOS binaries while tests ran on
  # Ubuntu only. One job per OS on a single Python version: enough to catch a
  # path/symlink/line-ending regression without quadrupling the matrix.
  # Split into two jobs (not a matrix) because a job-level `if` cannot read `matrix`.
  # The macOS runner pool is small, and dependabot bumps were starving it: jobs queued
  # for 15+ minutes and were then cancelled unacquired. So macOS skips dependabot PRs
  # (a skipped job counts as passing for required checks); pushes to main and every
  # human PR still run it. timeout-minutes caps a hung run well under the 6h default.
  test-macos:
    name: Test (macos-latest)
    if: github.event_name == 'push' || github.actor != 'dependabot[bot]'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Run tests
        run: uv run --locked --extra dev pytest -q

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Run tests
        run: uv run --locked --extra dev pytest -q
