version: 2
updates:
  # `uv` (not `pip`): updates pyproject.toml *and* uv.lock together, so dependency PRs
  # pass CI's `uv lock --check` / `--locked` instead of leaving the lock stale.
  - package-ecosystem: uv
    directory: "/"
    # Keep pyproject floors put (only uv.lock moves) unless a new version falls outside the range.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
