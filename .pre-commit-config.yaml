# Run `uv run pre-commit install` once to enable these hooks locally.
#
# The ruff hooks read the same rules as CI (configured in pyproject.toml). The `rev` below
# must match the version CI installs — the comment here used to claim "no drift" while this
# file pinned v0.8.6 and CI ran an unpinned `uvx ruff`, which is exactly how drift starts.
# CI now pins the same version; bump both together.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  # Type-checks src/ only (see [tool.mypy] in pyproject.toml). `pass_filenames: false`
  # because mypy needs the whole package to resolve cross-module types, not a file list.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml uses `!!python/name:pymdownx…` for the mermaid custom fence, which
        # safe-load can't construct — this hook has always failed on it. MkDocs validates
        # its own config via `mkdocs build --strict` in CI, so skip it here rather than
        # loosen the check (`--unsafe`) for every other YAML file.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
