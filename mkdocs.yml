site_name: agentry
site_description: A dependency manager for AI coding agents.
site_url: https://opentechil.github.io/agentry/
repo_url: https://github.com/OpenTechIL/agentry
repo_name: OpenTechIL/agentry
edit_uri: edit/main/docs/

docs_dir: docs

# Internal design/strategy artifacts (superpowers specs/plans, competitive analysis) live
# under docs/.local.docs/. MkDocs already skips dot-prefixed directories, so no explicit
# exclude_docs entry is needed — the previous patterns pointed at pre-move paths and
# silently matched nothing.

# `--strict` turns warnings into failures, so `warn` here already fails CI on a dead
# internal link or a missing heading anchor. Note this validates the *MkDocs* slugs only —
# GitHub renders README.md with a different slugifier, so avoid em dashes in headings you
# link to (see docs/architecture.md §4/§5).
validation:
  links:
    not_found: warn
    anchors: warn

theme:
  name: material
  logo: branding/logo.svg
  favicon: branding/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Commands: commands.md
  - Configuration: config-reference.md
  - Authoring: authoring.md
  - Troubleshooting: troubleshooting.md
  - Architecture: architecture.md
  - Knowledge base: knowledge-base.md
  - Branding: branding-kit.md
  - Contributing: https://github.com/OpenTechIL/agentry/blob/main/CONTRIBUTING.md
  - Changelog: https://github.com/OpenTechIL/agentry/blob/main/CHANGELOG.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OpenTechIL/agentry
