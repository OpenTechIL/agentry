# packaging/nfpm.yaml — build native Linux packages (.deb / .rpm) for `agentry`.
#
# Consumed by release-binaries.yml. The PyInstaller one-file binary must exist
# at ./dist/agentry first (`uv run --extra build pyinstaller packaging/agentry.spec`).
# VERSION is supplied via the environment (nfpm expands ${VERSION}):
#
#   VERSION=1.2.3 nfpm package -f packaging/nfpm.yaml -p deb -t ./out
#   VERSION=1.2.3 nfpm package -f packaging/nfpm.yaml -p rpm -t ./out
#
# Produces: agentry_<version>_amd64.deb and agentry-<version>.x86_64.rpm
name: agentry
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
section: utils
priority: optional
maintainer: agentry contributors <noreply@github.com>
vendor: OpenTech
homepage: https://github.com/OpenTechIL/agentry
license: MIT
description: |
  A dependency manager for AI coding agents.
  Install skills, agents, commands, tools, hooks and MCP servers per project —
  declare them in .agentry.yml, pin them in .agentry.lock, and reconcile with a
  single `agentry sync`.
contents:
  - src: ./dist/agentry
    dst: /usr/bin/agentry
    file_info:
      mode: 0755
  # Short aliases. `agy` is kept for back-compat but also belongs to Google's Antigravity
  # CLI, so `agyx` is the short name that can't collide. See src/agentry/progname.py.
  - src: /usr/bin/agentry
    dst: /usr/bin/agy
    type: symlink
  - src: /usr/bin/agentry
    dst: /usr/bin/agyx
    type: symlink
